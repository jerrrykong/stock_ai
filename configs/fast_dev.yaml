# ===== 全局 =====
random_seed: 42
log_level: INFO

# ===== 数据层 =====
data:
  symbols:
    - "600519"
  start: "20200101"
  end: "20241231"
  source: akshare
  cache_dir: data/raw
  adjust: none
  retry_times: 2
  retry_backoff: 1.0
  timeout: 10.0

# ===== 样本层 =====
sample:
  window: 10
  features:
    - open
    - high
    - low
    - close
    - volume
    - ma5
    - ma10
    - ma20
    - momentum
    - volatility
    - volume_ratio
  train_start: "20200101"
  train_end:   "20221231"
  test_start:  "20230101"
  test_end:    "20241231"
  embargo_days: 5
  normalize: true

# ===== 环境层（A 股规则）=====
env:
  initial_cash: 1000000.0
  commission_rate: 0.00025
  stamp_tax_rate: 0.0005
  slippage_rate: 0.001
  min_commission: 5.0
  reward_type: drawdown_penalty
  lambda_drawdown: 0.1
  lambda_turnover: 0.001
  # 注意：本环境 long-only 且买入即用尽现金（max_position=1.0），
  # position_ratio∈[0,1]、持仓即≈1，无法表达超额杠杆。λ_leverage 又是**按步**
  # 收取的（rewards.py 每步都算 λ·|pos|），于是这一项在满仓时的年成本
  # ≈ 0.01×231 ≈ 2.28 奖励点，而年基准波幅仅约 0.41（5.6 倍）——退化成
  # 「持仓时长税」，使「永不买入」成为全局最优。
  # 训练请用 `--reward excess`：该预设会把 λ_leverage 置 0。
  # 此处保留 0.01 是为了维持「缺省路径字节级不变」；仅 drawdown_penalty
  # 等非 excess 类型仍会命中该问题，详见 outputs/reward_diagnosis_report.md。
  lambda_leverage: 0.01
  max_position: 1.0
  lot_size: 100

# ===== 训练层（小样本快速调试）=====
train:
  algo: ppo
  timesteps: 5000
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  n_steps: 512
  batch_size: 64
  n_epochs: 4
  ent_coef: 0.0
  torch_threads: 1
  backend: auto
  out_dir: models

# ===== 路径 =====
paths:
  root: .
  raw: data/raw
  samples: data/samples
  models: models
  logs: logs
  reports: reports
