[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock_ai"
version = "1.0.0"
description = "A-share reinforcement-learning trading pipeline: fetch -> sample -> train -> backtest -> predict"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jerry" },
]
keywords = ["quant", "reinforcement-learning", "a-share", "ppo", "backtest"]

dependencies = [
    "numpy>=2.1,<2.6",
    "pandas>=2.2,<3.0",
    "scipy>=1.14",
    "pyarrow>=17.0,<22.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.9.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "gymnasium==1.1.1",
]

[project.optional-dependencies]
rl = [
    "torch>=2.6,<2.8",
    "stable-baselines3>=2.6,<2.9",
]
data = [
    "akshare>=1.14.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
stockai = "stock_ai.cli.main:main"
stock_ai = "stock_ai.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stock_ai.scale.ui" = ["static/*.html", "static/*.js", "static/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
